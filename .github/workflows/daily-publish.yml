name: Daily publish (06:00 KST)

# UTC 21:00 = KST 06:00. GH cron 은 ±15분 지연 허용 (spec § 1.2 합의).
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '시간 윈도우 (기본 24)'
        type: string
        default: '24'
      use_llm:
        description: 'LLM 점수화 사용 (ANTHROPIC_API_KEY 필요)'
        type: boolean
        default: false

permissions:
  contents: write   # commit data/today.js, feed.xml
  pages: write
  id-token: write   # GH Pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Collect → Score → Build → Validate → Feed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published_at: ${{ steps.commit.outputs.published_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      - name: Collect sources (HN + GitHub Trending + RSS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bind workflow input to env so the value is never inlined into the shell —
          # closes security P1 SEC-1 (shell injection via inputs.hours).
          HOURS_INPUT: ${{ inputs.hours || '24' }}
        run: |
          # Defense in depth: assert HOURS_INPUT is a positive integer before use.
          if ! [[ "$HOURS_INPUT" =~ ^[0-9]+$ ]] || [ "$HOURS_INPUT" -lt 1 ]; then
            echo "ERROR: HOURS_INPUT must be a positive integer, got: $HOURS_INPUT" >&2
            exit 1
          fi
          node scripts/collect.js \
            --hours="$HOURS_INPUT" \
            --out=data/raw-collection.json

      - name: Score with 4-criteria
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_LLM: ${{ inputs.use_llm }}
          HOURS_INPUT: ${{ inputs.hours || '24' }}
        run: |
          if [ "$USE_LLM" = "true" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            node scripts/score.js --in=data/raw-collection.json --out=data/scored-items.json --hours="$HOURS_INPUT" --llm
          else
            node scripts/score.js --in=data/raw-collection.json --out=data/scored-items.json --hours="$HOURS_INPUT"
          fi

      - name: Build today.js
        run: node scripts/build-today.js --in=data/scored-items.json --out=data/today.js

      - name: Validate data shape (gate)
        run: npm run validate

      - name: Generate RSS feed
        env:
          DN_SITE_URL: ${{ vars.DN_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: npm run feed

      - name: Run unit tests (regression gate)
        run: npm run test:unit

      # Pre-deploy E2E gate — the most important reliability change.
      # Previously E2E ran AFTER deploy, so a failed e2e meant 24h of broken
      # site until the next cron. Now E2E runs against the freshly-built
      # today.js BEFORE commit/push/deploy. Failure → no commit → no push →
      # no deploy → previous published version stays live (auto-rollback by
      # prevention). Closes adversarial ADV-3.
      - name: Install Playwright Chromium for pre-deploy gate
        run: npx playwright install --with-deps chromium
      - name: Pre-deploy E2E gate (happy path + perf + failure modes)
        run: npm run test:e2e

      - name: Commit + push regenerated artifacts
        id: commit
        run: |
          git config user.name "daily-publish-bot"
          git config user.email "actions@github.com"
          git add data/today.js feed.xml
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if git diff --cached --quiet; then
            echo "no changes (data unchanged today)"
            echo "published_at=skipped" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily publish: $NOW"
            # Rebase before push to handle queued workflow_dispatch + scheduled overlap.
            # Closes reliability REL-008 (race condition, low-conf P3).
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push
            echo "published_at=$NOW" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    outputs:
      # Re-export so e2e-after-deploy gets a stable URL even when not in same job
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  e2e-after-deploy:
    name: Post-deploy smoke (E2E against published site)
    runs-on: ubuntu-latest
    # needs both build (for outputs.published_at) AND deploy (for ordering + page_url).
    # Closes reliability P1 REL-001 — without `build` in needs:, GH Actions returned
    # empty string for needs.build.outputs.published_at, and `'' != 'skipped'` was
    # true, silently bypassing the skip-detection.
    needs: [build, deploy]
    timeout-minutes: 10
    if: needs.build.outputs.published_at != 'skipped'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run smoke against deployed URL
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          # 배포된 사이트가 안정화될 시간 확보 (60s)
          sleep 60
          # CP-1 만 — 페이지가 떴고 hero가 산출되었는지만 확인.
          # 깊은 회귀는 build job의 pre-deploy gate가 이미 잡았다.
          npm run test:e2e -- --grep "CP-1"
